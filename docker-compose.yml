version: '3.8'

services:
  broker:
    image: apache/kafka-native:4.0.1-rc2
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - rally-network

  # UI for Kafka
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "broker:29092"
    depends_on:
      - broker
    networks:
      - rally-network

  akhq:
    image: tchiotludo/akhq
    container_name: akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            rally-order:
              properties:
                bootstrap.servers: "broker:29092"
    ports:
      - "8070:8080"
    depends_on:
      - broker
    networks:
      - rally-network

  postgres:
    image: postgres:16-alpine
    container_name: rally_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rally-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d catalog_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: .
      secrets:
        - gh_actor
        - gh_token
    container_name: order_service
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: user
      DB_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      CATALOG_SERVICE_URL: http://host.docker.internal:8083/internal
      INVENTORY_SERVICE_URL: http://host.docker.internal:8087
      DEAL_SERVICE_URL: http://host.docker.internal:8085/internal
      PAYMENT_SERVICE_URL: http://host.docker.internal:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - broker
    networks:
      - rally-network

networks:
  rally-network:
    driver: bridge

volumes:
  pgdata:

secrets:
  gh_actor:
    environment: GITHUB_ACTOR
  gh_token:
    environment: GITHUB_TOKEN