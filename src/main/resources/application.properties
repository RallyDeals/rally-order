spring.application.name=rally-order
server.port=${SERVER_PORT:8081}
spring.profiles.active=prod

# DB
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:order_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
#spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=debug

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
# NOTE: producer/consumer factories and the listener container factory are built by hand in
# KafkaConfig, so Spring Boot's Kafka autoconfiguration (which normally reads the two properties
# below) never runs. Observation is therefore enabled directly in code on the KafkaTemplate and
# the ConcurrentKafkaListenerContainerFactory - these properties are kept only for documentation.
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# ===================================================================
# Actuator & Observability & Tracing
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# W3C baggage
management.tracing.baggage.remote-fields=X-Correlation-Id
management.tracing.baggage.correlation.fields=X-Correlation-Id
management.tracing.baggage.tag-fields=X-Correlation-Id

# Loki appender endpoint (consumed by logback-spring.xml springProperty)
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

# Service Url
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8083/internal}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8087}
deal.service.url=${DEAL_SERVICE_URL:http://localhost:8085/internal}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8082}

# Sweepers
sweeper.normal-order.reservation.fixed-delay-ms=2000
sweeper.normal-order.reservation.stale-after=20
sweeper.normal-order.reservation.batch-size=100

sweeper.normal-order.payment.fixed-delay-ms=2000
sweeper.normal-order.payment.stale-after=300
sweeper.normal-order.payment.batch-size=100

sweeper.deal-order.payment.fixed-delay-ms=60000
sweeper.deal-order.payment.stale-after=120
sweeper.deal-order.payment.batch-size=100

# Shipping status cron job
scheduler.shipping.cron=0 * * * * *
scheduler.shipping.processing-duration-seconds=300
scheduler.shipping.shipping-duration-seconds=600