spring.application.name=rally-order
server.port=8010
spring.profiles.active=dev

# DB
spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest

# Service Url
catalog.service.url=http://catalog-service:8082
inventory.service.url=http://inventory-service:8083
deal.service.url=http://deal-service:8084
payment.service.url=http://payment-service:8085

# Sweepers
sweeper.normal-order.reservation.fixed-delay-ms=2000
sweeper.normal-order.reservation.stale-after=20
sweeper.normal-order.reservation.batch-size=100

sweeper.normal-order.payment.fixed-delay-ms=2000
sweeper.normal-order.payment.stale-after=300
sweeper.normal-order.payment.batch-size=100

sweeper.deal-order.payment.fixed-delay-ms=2000
sweeper.deal-order.payment.stale-after=60
sweeper.deal-order.payment.batch-size=100

# Shipping status cron job
scheduler.shipping.cron=0 * * * * *
scheduler.shipping.processing-duration-seconds=300
scheduler.shipping.shipping-duration-seconds=600

